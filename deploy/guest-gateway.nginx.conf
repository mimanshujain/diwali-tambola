# Deny-by-default edge: the only public path to NestJS.
# Admin, TV, player rosters and full display data are deliberately NOT forwarded.
# Do not publish the API service itself via Cloudflare.
worker_processes auto;
events { worker_connections 1024; }
http {
  # cloudflared is the only container on the gateway's edge network.
  # Cloudflare sets CF-Connecting-IP; trust Docker bridge source IPs only.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;

  limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=player_actions:10m rate=60r/m;
  limit_conn_zone $binary_remote_addr zone=clients:10m;

  server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "private, no-store" always;

    # Never pass admin credentials to the upstream, even if a guest sends them.
    proxy_set_header X-Admin-Key "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 75s;
    proxy_connect_timeout 5s;

    # Upgrade support is used only by the Socket.IO path.

    location = /health/live {
      limit_except GET { deny all; }
      proxy_pass http://api:3000;
    }

    location ~ "^/g/[A-HJ-NP-Za-hj-np-z2-9]{6}$" {
      limit_except GET { deny all; }
      proxy_pass http://api:3000;
    }

    location ~ "^/join/[0-9a-fA-F-]{36}$" {
      limit_except GET { deny all; }
      proxy_pass http://api:3000;
    }

    location = /live/client.js {
      limit_except GET { deny all; }
      proxy_pass http://api:3000;
    }
    location = /socket.io/socket.io.js {
      limit_except GET { deny all; }
      proxy_pass http://api:3000;
    }

    location ^~ /socket.io/ {
      if ($request_method !~ ^(GET|POST)$) { return 405; }
      limit_conn clients 100;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Admin-Key "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_pass http://api:3000;
    }

    location ~ "^/games/[0-9a-fA-F-]{36}/guest-display$" {
      limit_except GET { deny all; }
      proxy_pass http://api:3000;
    }

    location ~ "^/games/[0-9a-fA-F-]{36}/players/me/(power)$" {
      limit_except GET { deny all; }
      proxy_pass http://api:3000;
    }

    location ~ "^/games/[0-9a-fA-F-]{36}/players/me$" {
      limit_except GET { deny all; }
      proxy_pass http://api:3000;
    }

    location ~ "^/games/[0-9a-fA-F-]{36}/players/register$" {
      if ($request_method != POST) { return 405; }
      limit_req zone=register burst=5 nodelay;
      proxy_pass http://api:3000;
    }

    location ~ "^/games/[0-9a-fA-F-]{36}/players/me/(submit|regenerate|claims|power/request)$" {
      if ($request_method != POST) { return 405; }
      limit_req zone=player_actions burst=30 nodelay;
      proxy_pass http://api:3000;
    }

    # Everything else—including ALL /admin, /tv and other /games endpoints.
    location / { return 404; }
  }
}
